name: App iOS e Android

on:
  push:
    paths: ['app/**', 'entrar.html', 'mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

jobs:
  android:
    name: Android (APK de teste)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Montar o app
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Compilar
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: forbarber-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simulador, sem assinatura)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Montar o app
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Compilar
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Empacotar
        run: cd mobile/ios/App/build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/forbarber-ios-simulador.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: forbarber-ios-simulador
          path: forbarber-ios-simulador.zip
