<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha conta · Grey Barber</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/vendor/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="conta" data-title="Minha conta">
  <header class="site-header" id="site-header"></header>

  <main id="conteudo" class="container account">
    <div class="account-head" id="account-head"></div>

    <div class="account-layout">
      <div class="stack-lg">
        <div class="tabs" role="tablist" aria-label="Minha conta">
          <button type="button" class="tab" role="tab" id="tab-agendamentos" data-tab="agendamentos" aria-controls="panel-agendamentos" aria-selected="true">Próximos</button>
          <button type="button" class="tab" role="tab" id="tab-historico" data-tab="historico" aria-controls="panel-historico" aria-selected="false">Histórico</button>
          <button type="button" class="tab" role="tab" id="tab-dados" data-tab="dados" aria-controls="panel-dados" aria-selected="false">Meus dados</button>
        </div>

        <section role="tabpanel" id="panel-agendamentos" aria-labelledby="tab-agendamentos"></section>
        <section role="tabpanel" id="panel-historico" aria-labelledby="tab-historico" hidden></section>

        <section role="tabpanel" id="panel-dados" aria-labelledby="tab-dados" hidden>
          <div class="stack-lg">
            <form id="profile-form" class="card card-pad stack" novalidate>
              <h2 class="summary-title">Dados pessoais</h2>
              <div class="form-grid">
                <div class="field full">
                  <label class="label" for="p-name">Nome completo</label>
                  <input class="input" id="p-name" name="name" autocomplete="name" required>
                </div>
                <div class="field">
                  <label class="label" for="p-email">E-mail</label>
                  <input class="input" id="p-email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                  <label class="label" for="p-phone">WhatsApp</label>
                  <input class="input" id="p-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>
                </div>
                <div class="field">
                  <label class="label" for="p-birthday">Aniversário</label>
                  <input class="input" id="p-birthday" name="birthday" type="date" autocomplete="bday">
                </div>
              </div>
              <div class="cluster"><button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i>Salvar alterações</button></div>
            </form>

            <form id="password-form" class="card card-pad stack" novalidate>
              <h2 class="summary-title">Alterar senha</h2>
              <div class="form-grid">
                <div class="field full">
                  <label class="label" for="pw-current">Senha atual</label>
                  <div class="input-icon"><i class="bi bi-lock" aria-hidden="true"></i>
                    <input class="input" id="pw-current" name="current" type="password" autocomplete="current-password" required>
                    <button type="button" class="input-action" data-toggle-password aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
                  </div>
                </div>
                <div class="field">
                  <label class="label" for="pw-new">Nova senha</label>
                  <input class="input" id="pw-new" name="password" type="password" autocomplete="new-password" required>
                </div>
                <div class="field">
                  <label class="label" for="pw-new2">Repita a nova senha</label>
                  <input class="input" id="pw-new2" name="password2" type="password" autocomplete="new-password" required>
                </div>
              </div>
              <div class="cluster"><button class="btn btn-outline" type="submit"><i class="bi bi-key"></i>Alterar senha</button></div>
            </form>

            <div class="card card-pad stack">
              <h2 class="summary-title">Privacidade</h2>
              <p class="muted text-sm">Você pode excluir sua conta a qualquer momento (LGPD). Os horários futuros são cancelados e você deixa de receber mensagens.</p>
              <div class="cluster">
                <button type="button" class="btn btn-danger btn-sm" id="delete-account"><i class="bi bi-trash"></i>Excluir minha conta</button>
              </div>
            </div>
          </div>
        </section>
      </div>

      <aside class="stack" id="account-side"></aside>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/booking.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/native.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/pages/conta.js"></script>
</body>
</html>
