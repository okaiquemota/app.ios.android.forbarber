<!DOCTYPE html>
<html lang="pt-BR" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agendamentos · Grey Barber</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preload" href="../assets/vendor/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/painel.css">
</head>
<body class="painel" data-page="agendamentos" data-title="Agendamentos">
  <div class="shell">
    <aside class="side" id="side" aria-label="Menu do painel"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="conteudo">
        <div class="page-head">
          <div><h1>Agendamentos</h1><p id="list-sub"></p></div>
          <div class="page-actions"><button type="button" class="btn btn-outline btn-sm" id="export"><i class="bi bi-download"></i>Exportar CSV</button></div>
        </div>
        <div class="filters">
          <div class="seg" id="period"></div>
          <select class="select" id="f-status" aria-label="Situação">
            <option value="">Todas as situações</option><option value="pendentes">Aguardando conclusão</option><option value="sinal">Sinal pendente</option><option value="clube">Clube de assinatura</option>
            <option value="confirmado">Confirmados</option><option value="concluido">Concluídos</option>
            <option value="cancelado">Cancelados</option><option value="faltou">Não compareceu</option>
          </select>
          <select class="select" id="f-barber" aria-label="Profissional"></select>
          <div class="search"><i class="bi bi-search" aria-hidden="true"></i><input class="input" id="f-q" placeholder="Cliente ou serviço" aria-label="Buscar"></div>
        </div>
        <div class="result-line" id="totals"></div>
        <section class="panel"><div class="panel-body flush" id="list"></div></section>
      </main>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/cloud.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pwa.js"></script>
  <script src="../assets/js/native.js"></script>
  <script src="../assets/js/painel.js"></script>
  <script src="../assets/js/painel/agendamentos.js"></script>
</body>
</html>
