<!DOCTYPE html>
<html lang="pt-BR" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Financeiro · Grey Barber</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preload" href="../assets/vendor/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/painel.css">
</head>
<body class="painel" data-page="financeiro" data-title="Financeiro">
  <div class="shell">
    <aside class="side" id="side" aria-label="Menu do painel"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="conteudo">
        <div class="page-head">
          <div><h1>Financeiro</h1><p id="period-label"></p></div>
          <div class="page-actions"><button type="button" class="btn btn-outline btn-sm" id="export"><i class="bi bi-download"></i>Exportar CSV</button></div>
        </div>
        <div class="filters">
          <div class="seg" id="period"></div>
          <span id="custom" class="cluster-sm" hidden>
            <input class="input input-sm" type="date" id="from" aria-label="De"><input class="input input-sm" type="date" id="to" aria-label="Até">
          </span>
          <select class="select" id="f-barber" aria-label="Profissional"></select>
        </div>
        <section class="kpis" id="kpis" aria-label="Indicadores do período"></section>
        <section class="panel">
          <div class="panel-head"><h2 class="panel-title"><i class="bi bi-bar-chart" aria-hidden="true"></i>Faturamento por dia</h2><span class="panel-sub" id="chart-sub"></span></div>
          <div class="panel-body"><div id="chart"></div><div id="chart-table"></div></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2 class="panel-title"><i class="bi bi-people" aria-hidden="true"></i>Por profissional e comissões</h2></div>
          <div class="panel-body flush" id="by-barber"></div>
        </section>
        <div class="grid-halves">
          <section class="panel"><div class="panel-head"><h2 class="panel-title"><i class="bi bi-scissors" aria-hidden="true"></i>Por serviço</h2></div><div class="panel-body" id="by-service"></div></section>
          <section class="panel"><div class="panel-head"><h2 class="panel-title"><i class="bi bi-wallet2" aria-hidden="true"></i>Formas de pagamento</h2></div><div class="panel-body" id="by-payment"></div></section>
        </div>
        <section class="panel">
          <div class="panel-head"><h2 class="panel-title"><i class="bi bi-fire" aria-hidden="true"></i>Horários de pico</h2><span class="panel-sub">Atendimentos concluídos por dia da semana e hora</span></div>
          <div class="panel-body" id="heatmap"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/cloud.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pwa.js"></script>
  <script src="../assets/js/native.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/painel.js"></script>
  <script src="../assets/js/painel/financeiro.js"></script>
</body>
</html>
