<!DOCTYPE html>
<html lang="pt-BR" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel · Grey Barber</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0c0a">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700&family=Rye&display=swap">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/painel.css">
</head>
<body class="painel" data-page="dashboard" data-title="Painel">
  <div class="shell">
    <aside class="side" id="side" aria-label="Menu do painel"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="conteudo">
        <div class="page-head">
          <div>
            <h1 id="greeting">Painel</h1>
            <p id="day-summary"></p>
          </div>
          <div class="page-actions">
            <a class="btn btn-outline btn-sm" href="agenda.html"><i class="bi bi-calendar3"></i>Abrir agenda</a>
          </div>
        </div>

        <section class="kpis" id="kpis" aria-label="Indicadores"></section>

        <div class="grid-main">
          <section class="panel" aria-labelledby="today-title">
            <div class="panel-head">
              <h2 class="panel-title" id="today-title"><i class="bi bi-clock" aria-hidden="true"></i>Agenda de hoje</h2>
              <span class="panel-sub" id="today-sub"></span>
            </div>
            <div class="panel-body flush" id="today-list"></div>
          </section>
          <div class="stack">
            <section class="panel" aria-labelledby="occ-title">
              <div class="panel-head">
                <h2 class="panel-title" id="occ-title"><i class="bi bi-speedometer" aria-hidden="true"></i>Ocupação hoje</h2>
              </div>
              <div class="panel-body" id="occupancy"></div>
            </section>
            <section class="panel" id="messages-panel" aria-labelledby="msg-title" hidden>
              <div class="panel-head">
                <h2 class="panel-title" id="msg-title"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Mensagens do site</h2>
                <a class="link text-sm" href="mensagens.html">Ver todas</a>
              </div>
              <div class="panel-body flush" id="messages"></div>
            </section>
          </div>
        </div>

        <div class="grid-main">
          <section class="panel" aria-labelledby="rev-title">
            <div class="panel-head">
              <h2 class="panel-title" id="rev-title"><i class="bi bi-bar-chart" aria-hidden="true"></i>Faturamento · últimos 30 dias</h2>
              <span class="panel-sub" id="rev-sub"></span>
            </div>
            <div class="panel-body">
              <div id="rev-chart"></div>
              <div id="rev-table"></div>
            </div>
          </section>
          <section class="panel" aria-labelledby="top-title">
            <div class="panel-head">
              <h2 class="panel-title" id="top-title"><i class="bi bi-trophy" aria-hidden="true"></i>Mais pedidos no mês</h2>
            </div>
            <div class="panel-body" id="top-services"></div>
          </section>
        </div>

        <div class="grid-halves">
          <section class="panel" aria-labelledby="bday-title">
            <div class="panel-head">
              <h2 class="panel-title" id="bday-title"><i class="bi bi-cake2" aria-hidden="true"></i>Aniversariantes do mês</h2>
              <span class="panel-sub">Mande um parabéns com desconto</span>
            </div>
            <div class="panel-body flush" id="birthdays"></div>
          </section>
          <section class="panel" aria-labelledby="react-title">
            <div class="panel-head">
              <h2 class="panel-title" id="react-title"><i class="bi bi-arrow-repeat" aria-hidden="true"></i>Clientes para reativar</h2>
              <span class="panel-sub">Sem visita há mais de 45 dias</span>
            </div>
            <div class="panel-body flush" id="reactivate"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/cloud.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/painel.js"></script>
  <script src="../assets/js/painel/dashboard.js"></script>
</body>
</html>
