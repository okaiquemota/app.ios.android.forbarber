<!DOCTYPE html>
<html lang="pt-BR" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Produtos · Grey Barber</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preload" href="../assets/vendor/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/painel.css">
</head>
<body class="painel" data-page="produtos" data-title="Produtos">
  <div class="shell">
    <aside class="side" id="side" aria-label="Menu do painel"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="conteudo">
        <div class="page-head">
          <div><h1>Produtos</h1><p>Estoque, vendas no balcão e produtos da comanda do atendimento.</p></div>
          <div class="page-actions">
            <button type="button" class="btn btn-outline btn-sm" id="new-product" hidden><i class="bi bi-plus-lg"></i>Novo produto</button>
            <button type="button" class="btn btn-primary btn-sm" id="new-sale"><i class="bi bi-bag-plus"></i>Nova venda</button>
          </div>
        </div>
        <section class="kpis" id="kpis" aria-label="Resumo de produtos"></section>
        <div class="tabs" role="tablist" aria-label="Produtos">
          <button type="button" class="tab" role="tab" id="tab-estoque" data-tab="estoque" aria-controls="panel-estoque" aria-selected="true">Estoque</button>
          <button type="button" class="tab" role="tab" id="tab-vendas" data-tab="vendas" aria-controls="panel-vendas" aria-selected="false">Vendas</button>
        </div>
        <section role="tabpanel" id="panel-estoque" aria-labelledby="tab-estoque" class="stack">
          <div class="filters">
            <div class="seg" id="stock-filter"></div>
            <div class="search"><i class="bi bi-search" aria-hidden="true"></i><input class="input" id="f-q" placeholder="Buscar produto" aria-label="Buscar produto"></div>
          </div>
          <section class="panel"><div class="panel-body flush" id="stock-list"></div></section>
          <section class="panel" id="commission-panel" hidden>
            <div class="panel-body cluster">
              <i class="bi bi-percent subtle" aria-hidden="true"></i>
              <label class="grow" for="prod-commission">Comissão do barbeiro sobre os produtos que ele vende</label>
              <span class="cluster-sm"><input class="input input-sm" id="prod-commission" type="number" inputmode="decimal" min="0" max="100" step="0.5" style="width:5.5rem"><span>%</span></span>
              <button type="button" class="btn btn-outline btn-sm" id="save-commission">Salvar</button>
            </div>
          </section>
        </section>
        <section role="tabpanel" id="panel-vendas" aria-labelledby="tab-vendas" class="stack" hidden>
          <div class="filters">
            <div class="seg" id="sales-period"></div>
            <select class="select" id="f-barber" aria-label="Profissional"></select>
          </div>
          <section class="panel"><div class="panel-body flush" id="sales-list"></div></section>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/cloud.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pwa.js"></script>
  <script src="../assets/js/native.js"></script>
  <script src="../assets/js/comanda.js"></script>
  <script src="../assets/js/painel.js"></script>
  <script src="../assets/js/avisos.js"></script>
  <script src="../assets/js/painel/produtos.js"></script>
</body>
</html>
