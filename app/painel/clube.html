<!DOCTYPE html>
<html lang="pt-BR" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clube · Grey Barber</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preload" href="../assets/vendor/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/painel.css">
</head>
<body class="painel" data-page="clube" data-title="Clube">
  <div class="shell">
    <aside class="side" id="side" aria-label="Menu do painel"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="conteudo">
        <div class="page-head">
          <div><h1>Clube de assinatura</h1><p>Planos mensais, assinantes e renovações.</p></div>
          <div class="page-actions">
            <button type="button" class="btn btn-outline btn-sm" id="new-plan"><i class="bi bi-plus-lg"></i>Novo plano</button>
            <button type="button" class="btn btn-primary btn-sm" id="new-sub"><i class="bi bi-person-plus"></i>Novo assinante</button>
          </div>
        </div>
        <section class="kpis" id="club-kpis" aria-label="Indicadores do clube"></section>
        <section class="panel" aria-labelledby="plans-title">
          <div class="panel-head"><h2 class="panel-title" id="plans-title"><i class="bi bi-stars" aria-hidden="true"></i>Planos</h2><span class="panel-sub">Aparecem no site da barbearia na aba Clube</span></div>
          <div class="panel-body"><div class="club-plans" id="plans"></div></div>
        </section>
        <section class="panel" aria-labelledby="subs-title">
          <div class="panel-head">
            <h2 class="panel-title" id="subs-title"><i class="bi bi-people" aria-hidden="true"></i>Assinantes</h2>
            <div class="seg" id="sub-filter">
              <button type="button" data-f="ativas" aria-pressed="true">Ativas</button><button type="button" data-f="vencidas" aria-pressed="false">Vencidas</button><button type="button" data-f="canceladas" aria-pressed="false">Canceladas</button><button type="button" data-f="todas" aria-pressed="false">Todas</button>
            </div>
          </div>
          <div class="panel-body flush" id="subs"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/cloud.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pwa.js"></script>
  <script src="../assets/js/native.js"></script>
  <script src="../assets/js/painel.js"></script>
  <script src="../assets/js/painel/clube.js"></script>
</body>
</html>
